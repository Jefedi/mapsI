services:
  mapsi:
    build: .
    container_name: mapsi
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    container_name: mapsi-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mapsi
    restart: unless-stopped
