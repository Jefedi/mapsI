name: Build iOS IPA

on:
  push:
    branches: [ master, 'claude/**' ]
    paths:
      - 'MapsI/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'MapsI/**'
  workflow_dispatch:

env:
  PROJECT_PATH: MapsI/MapsI.xcodeproj
  SCHEME: MapsI
  CONFIGURATION: Release
  DESTINATION: 'generic/platform=iOS'

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # List available Xcode versions and pick the latest
          ls /Applications/ | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project "$PROJECT_PATH" -list

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/MapsI.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -50

      - name: Inspect archive structure
        if: always()
        run: |
          echo "=== Archive contents ==="
          find "$RUNNER_TEMP/MapsI.xcarchive" -maxdepth 4 -type d 2>/dev/null || echo "No archive found"
          echo ""
          echo "=== Looking for .app ==="
          find "$RUNNER_TEMP/MapsI.xcarchive" -name "*.app" -type d 2>/dev/null || echo "No .app found"

      - name: Create IPA from archive
        run: |
          # Find the .app bundle inside the archive
          APP_PATH=$(find "$RUNNER_TEMP/MapsI.xcarchive" -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            echo "=== Last 100 lines of build log ==="
            tail -100 "$RUNNER_TEMP/build.log"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          # Create Payload directory
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"

          # Create IPA (zip of Payload)
          cd "$RUNNER_TEMP"
          zip -r -9 MapsI.ipa Payload

          echo "IPA created successfully"
          echo "IPA size: $(du -h MapsI.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapsI-${{ github.sha }}
          path: ${{ runner.temp }}/MapsI.ipa
          retention-days: 30

      - name: Upload archive
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MapsI-archive-${{ github.sha }}
          path: ${{ runner.temp }}/MapsI.xcarchive
          retention-days: 14
