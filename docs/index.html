<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MapsI">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="MapsI - Navigation GPS gratuite avec OpenStreetMap">
    <title>MapsI</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Map View -->
    <div id="map-view">
        <div id="map"></div>

        <!-- Speed Display (during navigation) -->
        <div id="speed-display" class="hidden">
            <span id="speed-value">0</span>
            <span id="speed-unit">km/h</span>
        </div>

        <!-- Locate Me Button -->
        <button id="locate-btn" aria-label="Ma position">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
        </button>

        <!-- POI Button -->
        <button id="poi-btn" aria-label="Points d'interet">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="9" r="2.5" fill="currentColor"/>
            </svg>
        </button>
    </div>

    <!-- Search View -->
    <div id="search-view" class="hidden">
        <!-- Favorites Section -->
        <div id="favorites-section">
            <div class="section-header">
                <span>Favoris</span>
                <button id="add-favorite-btn">+ Ajouter</button>
            </div>
            <div id="favorites-list"></div>
        </div>

        <!-- History Section -->
        <div id="history-container">
            <div id="history-header">
                <span>Historique</span>
                <button id="history-clear-btn">Effacer</button>
            </div>
            <div id="history-list"></div>
            <div id="history-empty">
                <svg viewBox="0 0 24 24" width="48" height="48">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
                    <path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
                </svg>
                <p>Aucun historique</p>
            </div>
        </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="hidden">
        <div class="settings-group">
            <div class="settings-title">Affichage</div>
            <div class="setting-item">
                <span>Mode sombre</span>
                <label class="toggle">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Guidage vocal</span>
                <label class="toggle">
                    <input type="checkbox" id="voice-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="settings-group">
            <div class="settings-title">Navigation</div>
            <div class="setting-item">
                <span>Recalcul automatique</span>
                <label class="toggle">
                    <input type="checkbox" id="auto-reroute-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Afficher la vitesse</span>
                <label class="toggle">
                    <input type="checkbox" id="show-speed-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="settings-group">
            <div class="settings-title">A propos</div>
            <div class="setting-info">
                <span>MapsI v2.0</span>
                <span class="text-secondary">Navigation GPS gratuite</span>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div id="search-container">
        <div id="search-bar">
            <svg id="search-icon" viewBox="0 0 24 24" width="20" height="20">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" id="search-input" placeholder="Rechercher une adresse..." autocomplete="off" autocorrect="off" autocapitalize="off">
            <button id="search-clear" class="hidden">&times;</button>
        </div>
        <div id="search-results" class="hidden"></div>
    </div>

    <!-- Bottom Toolbar -->
    <div id="toolbar">
        <button class="toolbar-btn active" data-view="map">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M9 2L4 5v15l5-3 6 3 5-3V2l-5 3-6-3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9 2v15M15 5v15" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Carte</span>
        </button>
        <button class="toolbar-btn" data-view="search">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Recherche</span>
        </button>
        <button class="toolbar-btn" data-view="settings">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Reglages</span>
        </button>
    </div>

    <!-- Navigation Panel -->
    <div id="nav-panel" class="hidden">
        <div id="nav-header">
            <div id="nav-info">
                <span id="nav-distance"></span>
                <span id="nav-separator">•</span>
                <span id="nav-duration"></span>
                <span id="nav-eta"></span>
            </div>
            <button id="nav-close">&times;</button>
        </div>

        <!-- Route Alternatives -->
        <div id="route-alternatives" class="hidden">
            <div class="route-option active" data-route="0">
                <span class="route-time"></span>
                <span class="route-dist"></span>
            </div>
        </div>

        <div id="transport-modes" class="hidden">
            <button class="transport-btn active" data-mode="driving">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 11l1.5-4.5h11L19 11M5 11v6h2v1a1 1 0 001 1h1a1 1 0 001-1v-1h4v1a1 1 0 001 1h1a1 1 0 001-1v-1h2v-6M5 11h14M7.5 15a1 1 0 100-2 1 1 0 000 2zM16.5 15a1 1 0 100-2 1 1 0 000 2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Auto</span>
            </button>
            <button class="transport-btn" data-mode="walking">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M13 4a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM7 21l3-7 2.5 2v5h2v-6.5l-2.5-2.5.7-3A6.2 6.2 0 0017 11V9a4.8 4.8 0 01-3.5-1.5L12 6a2 2 0 00-1.6-.8c-.5 0-1 .2-1.4.5L5 8.5V13h2V9.5l1.5-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Marche</span>
            </button>
            <button class="transport-btn" data-mode="cycling">
                <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="6" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 17l3-7h4l2 4h3M11 6a1 1 0 100-2 1 1 0 000 2zM12 10h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Velo</span>
            </button>
        </div>
        <div id="nav-instruction">
            <span id="nav-step-text"></span>
        </div>
        <div id="nav-actions">
            <button id="nav-share-btn">Partager</button>
            <button id="nav-start-btn">Demarrer</button>
        </div>
    </div>

    <!-- Active Navigation -->
    <div id="active-nav" class="hidden">
        <div id="active-nav-instruction">
            <div id="active-nav-icon"></div>
            <div id="active-nav-text">
                <div id="active-nav-distance"></div>
                <div id="active-nav-street"></div>
            </div>
        </div>
        <div id="active-nav-info">
            <div id="active-nav-remaining">
                <span id="remaining-distance"></span>
                <span id="remaining-time"></span>
            </div>
            <div id="active-nav-eta">Arrivee: <span id="eta-time"></span></div>
        </div>
        <button id="active-nav-stop">Arreter</button>
    </div>

    <!-- POI Panel -->
    <div id="poi-panel" class="hidden">
        <div class="poi-header">
            <span>Points d'interet</span>
            <button id="poi-close">&times;</button>
        </div>
        <div class="poi-categories">
            <button class="poi-cat-btn" data-cat="fuel">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 22V6a2 2 0 012-2h8a2 2 0 012 2v16M3 22h12M7 4V2M11 4V2M15 10h2a2 2 0 012 2v5a2 2 0 002 2M19 10V8l-4-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Essence
            </button>
            <button class="poi-cat-btn" data-cat="restaurant">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3M18 22v-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Restaurant
            </button>
            <button class="poi-cat-btn" data-cat="parking">
                <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 17V7h4a3 3 0 010 6H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Parking
            </button>
            <button class="poi-cat-btn" data-cat="pharmacy">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                Pharmacie
            </button>
        </div>
        <div id="poi-results"></div>
    </div>

    <!-- Add Favorite Modal -->
    <div id="favorite-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>Ajouter un favori</span>
                <button id="favorite-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="favorite-name" placeholder="Nom (ex: Maison)">
                <div class="favorite-icons">
                    <button class="fav-icon-btn active" data-icon="home">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="fav-icon-btn" data-icon="work">
                        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="2" y="7" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                    <button class="fav-icon-btn" data-icon="star">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="fav-icon-btn" data-icon="heart">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                </div>
                <button id="save-favorite-btn">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>Partager</span>
                <button id="share-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <button id="share-position-btn" class="share-option">
                    <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    Ma position actuelle
                </button>
                <button id="share-route-btn" class="share-option">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 12h18M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    L'itineraire
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden">
        <div class="spinner"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
