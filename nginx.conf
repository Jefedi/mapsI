server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-protobuf;

    # --- API Proxies (self-hosted services) ---

    # Nominatim (geocoding)
    location /api/nominatim/ {
        proxy_pass http://nominatim:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Valhalla (routing - all profiles: auto, pedestrian, bicycle)
    location /api/valhalla/ {
        proxy_pass http://valhalla:8002/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Overpass API (POI search)
    location /api/overpass/ {
        proxy_pass http://overpass:80/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # OpenTopoData (elevation)
    location /api/elevation/ {
        proxy_pass http://elevation:5000/;
        proxy_set_header Host $host;
    }

    # Fuel price proxy
    location /api/fuel/ {
        proxy_pass http://fuel-proxy:8000/;
        proxy_set_header Host $host;
    }

    # TileServer GL (map tiles)
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback for static assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
